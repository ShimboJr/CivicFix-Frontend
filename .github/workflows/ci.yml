# .github/workflows/ci.yml  (CivicFix-Frontend)
#
# Two-job pipeline:
#
#   frontend  — Lint (oxlint) + Vite production build.
#               Runs on every push and pull_request to main.
#               This is the code-correctness gate.
#
#   deploy    — Four-step Vercel production pipeline:
#               Only runs when `frontend` passes AND the event is a direct
#               push to main (never on pull requests).
#
#               1. vercel pull / build / deploy --prebuilt --prod
#                  Creates a real Vercel deployment with its own unique URL
#                  (NEW_DEPLOYMENT_URL). "Auto-assign Custom Production Domains"
#                  is disabled in the Vercel project, so this URL is NOT yet
#                  what the custom domain (sjr-civicfix.vercel.app) serves.
#
#               2. Health check against NEW_DEPLOYMENT_URL
#                  Confirms the new build actually responds before any
#                  promotion happens.  A broken build never reaches step 3.
#
#               3. vercel promote NEW_DEPLOYMENT_URL
#                  Explicitly aliases the custom production domain to this
#                  deployment.  Required because Vercel's auto-assignment is
#                  disabled — without this step the custom domain would keep
#                  serving the previous deployment regardless of step 1.
#
#               4. Post-promotion domain check
#                  A curl against sjr-civicfix.vercel.app confirms the live
#                  domain is now serving the new build, not just that the
#                  promote command exited successfully.
#
# NOTE — monorepo context:
#   The backend lives in a separate repository (CivicFix-Backend) and has its
#   own CI workflow there.  This workflow covers the frontend only.

name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Lint + Build ──────────────────────────────────────────────────────
  frontend:
    name: Lint + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'          # LTS — matches the project's target runtime
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        # Runs oxlint via the "lint" script in package.json
        # (configured in .oxlintrc.json — enforces React hooks rules).
        # oxlint exits non-zero on any error, blocking everything downstream.
        run: npm run lint

      - name: Build
        # A successful Vite build confirms no import errors, missing modules,
        # or JSX transform failures — a reasonable CI stand-in until a frontend
        # test suite is added.
        env:
          # Vite bakes VITE_* vars into the bundle at build time.
          # The API URL must exist so the build doesn't fail on undefined imports,
          # but the value doesn't need to be a real server for a build-only check.
          VITE_API_URL: https://placeholder-for-ci-build-only.example.com/api
        run: npm run build

  # ── Job 2: Deploy to Vercel production ──────────────────────────────────────
  deploy:
    name: Deploy → Vercel (production)
    runs-on: ubuntu-latest

    # Hard gate: this job is skipped entirely (not just "failed") when the
    # lint/build job fails — Vercel never sees a broken commit.
    needs: [frontend]

    # Only deploy on a direct push to main.  Pull-request runs are excluded so
    # preview/review workflows don't accidentally write to production.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    env:
      VERCEL_TOKEN:      ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Pull remote Vercel project settings and env vars into .vercel/
      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=$VERCEL_TOKEN

      # Build the production bundle using Vercel's build pipeline.
      # This generates the .vercel/output/ directory consumed by the next step.
      - name: Build for production (Vercel)
        run: vercel build --prod --token=$VERCEL_TOKEN

      # Deploy the pre-built output to production and capture the deployment URL.
      #
      # This creates a real Vercel deployment with its own unique "throwaway" URL
      # (NEW_DEPLOYMENT_URL).  Because "Auto-assign Custom Production Domains" is
      # disabled in the Vercel project settings, this deployment is NOT yet what
      # sjr-civicfix.vercel.app serves — that aliasing happens in the promote step.
      #
      # CRITICAL — stdout and stderr MUST be kept separate:
      #   Per Vercel CLI documentation, stdout from `vercel deploy` is always
      #   exactly the deployment URL and nothing else.  Progress/status messages
      #   go to stderr.  Merging them (e.g. with 2>&1) or piping them through a
      #   combined stream (tee, grep, tail) causes status fragments like
      #   "Building…" to concatenate directly onto the URL, producing a malformed
      #   value that silently breaks the health-check curl downstream.
      #
      #   Correct pattern (mirrors the backend workflow):
      #     stdout → captured by $(...) → clean URL
      #     stderr → separate file     → never enters the URL variable
      - name: Deploy pre-built output
        id: vercel_deploy
        run: |
          NEW_DEPLOYMENT_URL=$(vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN \
            2> deploy-error.txt)
          # Echo stderr to the Actions log so any warnings remain visible
          if [ -s deploy-error.txt ]; then
            echo "--- Vercel CLI stderr ---"
            cat deploy-error.txt
            echo "------------------------"
          fi
          # Trim any trailing whitespace/newline the shell may leave
          NEW_DEPLOYMENT_URL="${NEW_DEPLOYMENT_URL%%[[:space:]]}"
          echo "new_url=${NEW_DEPLOYMENT_URL}" >> "$GITHUB_OUTPUT"

      # ── URL validation ────────────────────────────────────────────────────────
      # Fail fast with a clear message if the captured URL is malformed.
      # This catches any future regression (e.g. a CLI update that changes output
      # behaviour) before a bad value silently reaches curl and causes a confusing
      # indirect failure.
      - name: Validate deployment URL
        env:
          NEW_DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.new_url }}
        run: |
          echo "Captured deployment URL: '${NEW_DEPLOYMENT_URL}'"
          # Must start with https://, contain no spaces, and have no trailing text
          # beyond a valid hostname/path (no embedded status words like "Building…")
          if ! echo "${NEW_DEPLOYMENT_URL}" | grep -qE '^https://[^ ]+$'; then
            echo "❌  Deployment URL is malformed: '${NEW_DEPLOYMENT_URL}'"
            echo "    Expected a bare https:// URL with no spaces or trailing text."
            echo "    Check the 'Deploy pre-built output' step log for stderr output"
            echo "    from the Vercel CLI that may have merged into the URL."
            exit 1
          fi
          echo "✅  URL looks well-formed."

      # ── Step 2: Health check against NEW_DEPLOYMENT_URL ─────────────────────
      # Gates the promote step: a broken build should never be aliased to the
      # custom production domain.  Retries up to 6 times with a 10-second
      # back-off to absorb Vercel's edge propagation delay.  Anything
      # 2xx/3xx/4xx is "alive"; only 5xx or an unreachable host fails the job.
      - name: Health check (new deployment URL)
        id: health_check
        env:
          NEW_DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.new_url }}
        run: |
          echo "Running health check against ${NEW_DEPLOYMENT_URL}"
          for i in 1 2 3 4 5 6; do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 15 "${NEW_DEPLOYMENT_URL}" || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" -ge 500 ] 2>/dev/null; then
              echo "Server returned ${HTTP_STATUS} — deployment is unhealthy."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "❌  Health check failed after 6 attempts. Aborting — promotion skipped."
                exit 1
              fi
            elif [ "$HTTP_STATUS" = "000" ]; then
              echo "Could not reach the deployment endpoint."
              if [ "$i" -lt 6 ]; then
                echo "Retrying in 10 s..."
                sleep 10
              else
                echo "❌  Health check failed after 6 attempts. Aborting — promotion skipped."
                exit 1
              fi
            else
              echo "✅  Health check passed (HTTP ${HTTP_STATUS})."
              exit 0
            fi
          done

      # ── Step 3: Promote to custom production domain ───────────────────────────
      # Because "Auto-assign Custom Production Domains" is disabled in the Vercel
      # project, `vercel deploy --prod` alone does NOT update what the custom
      # domain serves.  This explicit promote step is the only way to alias
      # sjr-civicfix.vercel.app → NEW_DEPLOYMENT_URL.
      #
      # --yes bypasses the interactive confirmation prompt (required in CI).
      # VERCEL_TOKEN is already exported in the job-level env block and is
      # detected automatically by the CLI — no --token flag needed here.
      - name: Promote deployment to production domain
        env:
          NEW_DEPLOYMENT_URL: ${{ steps.vercel_deploy.outputs.new_url }}
        run: |
          echo "Promoting ${NEW_DEPLOYMENT_URL} → sjr-civicfix.vercel.app"
          vercel promote "${NEW_DEPLOYMENT_URL}" \
            --yes \
            --token=$VERCEL_TOKEN
          echo "✅  Promote command completed."

      # ── Step 4: Post-promotion domain check ──────────────────────────────────
      # Confirms that sjr-civicfix.vercel.app is now serving the new build, not
      # just that the promote command exited successfully.  Retries up to 6 times
      # with a 15-second back-off to allow Vercel's edge network to propagate
      # the alias before declaring a failure.
      - name: Post-promotion domain check
        run: |
          CUSTOM_DOMAIN="https://sjr-civicfix.vercel.app"
          echo "Verifying custom domain is live: ${CUSTOM_DOMAIN}"
          for i in 1 2 3 4 5 6; do
            HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
              --max-time 20 "${CUSTOM_DOMAIN}" || echo "000")
            echo "Attempt ${i}: HTTP ${HTTP_STATUS}"
            if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 500 ] 2>/dev/null; then
              echo "✅  Custom domain is live (HTTP ${HTTP_STATUS})."
              exit 0
            elif [ "$HTTP_STATUS" = "000" ]; then
              echo "Could not reach ${CUSTOM_DOMAIN}."
            else
              echo "Unexpected status ${HTTP_STATUS} from custom domain."
            fi
            if [ "$i" -lt 6 ]; then
              echo "Retrying in 15 s..."
              sleep 15
            else
              echo "❌  Custom domain did not respond successfully after 6 attempts."
              echo "    Promote may have succeeded but edge propagation is delayed."
              echo "    Check the Vercel dashboard for the current production alias."
              exit 1
            fi
          done
