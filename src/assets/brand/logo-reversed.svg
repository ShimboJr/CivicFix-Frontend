<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="CivicFix mark">
  <!--
    logo-reversed.svg — for use on dark backgrounds (#0B4F6C, #0d1b2a, etc.)
    The arc becomes white, the pin becomes white, accent dots remain amber.
    Inner dot becomes the brand teal so it contrasts on the white pin face.
  -->

  <!-- Open community arc — white on dark -->
  <path
    d="M 12.5 20 A 11.5 11.5 0 1 1 35.5 20"
    stroke="#ffffff"
    stroke-width="1.75"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Pin teardrop — white -->
  <path
    d="M 17 20 A 7 7 0 0 1 31 20 C 31 26.5 24 34 24 34 C 24 34 17 26.5 17 20 Z"
    fill="#ffffff"
  />

  <!-- Inner dot — teal so it reads on the white pin -->
  <circle cx="24" cy="20" r="2.5" fill="#0B4F6C" />

  <!-- Inner ring -->
  <circle
    cx="24"
    cy="20"
    r="4.5"
    stroke="rgba(255,255,255,0.30)"
    stroke-width="1"
    fill="none"
  />

  <!-- Community node dots — amber accent -->
  <circle cx="12.5" cy="20" r="2" fill="#D97706" />
  <circle cx="35.5" cy="20" r="2" fill="#D97706" />
</svg>
