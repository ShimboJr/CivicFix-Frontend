<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="CivicFix">
  <!--
    CivicFix favicon.svg
    32×32 viewBox — optimised for 16–64 px rendering.
    At 16 px: the teal pin body reads as a clear location marker.
    At 32 px: the open arc and amber dots are fully legible.

    The mark is centered in a rounded-square teal background for
    app-icon contexts (browser tab, bookmarks).
  -->

  <!-- Rounded-square background -->
  <rect width="32" height="32" rx="7" ry="7" fill="#0B4F6C"/>

  <!--
    Mark scaled to fit: original 48×48 viewBox scaled to ~28×28 (87.5%)
    then centered: translate((32-28)/2, (32-28)/2) = translate(2, 2)
    scale(28/48) = scale(0.583)
    Combined: translate(2,2) scale(0.583)
  -->
  <g transform="translate(2,2) scale(0.583)">
    <!-- Open community arc — white on dark bg -->
    <path
      d="M 12.5 20 A 11.5 11.5 0 1 1 35.5 20"
      stroke="#ffffff"
      stroke-width="2.5"
      stroke-linecap="round"
      fill="none"
    />
    <!-- Pin teardrop — white -->
    <path
      d="M 17 20 A 7 7 0 0 1 31 20 C 31 26.5 24 34 24 34 C 24 34 17 26.5 17 20 Z"
      fill="#ffffff"
    />
    <!-- Inner dot — teal -->
    <circle cx="24" cy="20" r="2.5" fill="#0B4F6C"/>
    <!-- Community node dots — amber -->
    <circle cx="12.5" cy="20" r="2.5" fill="#D97706"/>
    <circle cx="35.5" cy="20" r="2.5" fill="#D97706"/>
  </g>
</svg>